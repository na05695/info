<script>

/* ==================================
   掛け算
================================== */

let a = 0;
let b = 0;

let answer = "";

let score = 0;
let total = 0;


function newQuestion(){

    a =
        Math.floor(Math.random() * 9) + 1;

    b =
        Math.floor(Math.random() * 9) + 1;

    answer = "";

    document
        .getElementById("question")
        .textContent =
        a + " × " + b;

    updateDisplay();

    document
        .getElementById("result")
        .textContent = "";
}


function pressNumber(number){

    if(answer.length >= 3){
        return;
    }

    answer += number;

    updateDisplay();
}


function deleteNumber(){

    answer =
        answer.slice(0,-1);

    updateDisplay();
}


function clearAnswer(){

    answer = "";

    updateDisplay();
}


function updateDisplay(){

    const display =
        document.getElementById(
            "answerDisplay"
        );

    if(answer === ""){

        display.textContent =
            "答えを入力";

        display.classList.add(
            "empty"
        );

    }else{

        display.textContent =
            answer;

        display.classList.remove(
            "empty"
        );

    }
}


function checkAnswer(){

    if(answer === ""){
        return;
    }

    const value =
        Number(answer);

    if(value === a * b){

        score++;
        total++;

        document
            .getElementById("result")
            .innerHTML =
            '<span class="correct">' +
            '✓ 正解！ 次の問題へ！' +
            '</span>';

        document
            .getElementById("score")
            .textContent =
            score;

        document
            .getElementById("total")
            .textContent =
            total;

        setTimeout(
            function(){
                newQuestion();
            },
            500
        );

    }else{

        total++;

        document
            .getElementById("result")
            .innerHTML =
            '<span class="wrong">' +
            '✕ 不正解！ もう一度！' +
            '</span>';

        document
            .getElementById("total")
            .textContent =
            total;

        setTimeout(
            function(){
                clearAnswer();
            },
            400
        );
    }
}


/* ==================================
   このサイトについて
================================== */

let aboutCount = 0;

function aboutClick(){

    aboutCount++;

    if(aboutCount <= 2){

        showPage("aboutPage");

    }else{

        showPage("searchPage");

    }
}


/* ==================================
   画面切り替え
================================== */

function showPage(id){

    document
        .getElementById("aboutPage")
        .classList.remove("show");

    document
        .getElementById("searchPage")
        .classList.remove("show");

    document
        .getElementById(id)
        .classList.add("show");

    history.pushState(
        {
            page:id
        },
        "",
        "#" + id
    );
}


function goBack(){

    history.back();

}


window.addEventListener(
    "popstate",
    function(){

        document
            .getElementById("aboutPage")
            .classList.remove("show");

        document
            .getElementById("searchPage")
            .classList.remove("show");

    }
);


/* ==================================
   Google
================================== */

function googleSearch(){

    const query =
        document
            .getElementById("searchInput")
            .value
            .trim();

    if(query === ""){
        return;
    }

    const url =
        "https://www.google.com/search?igu=1&q=" +
        encodeURIComponent(query);

    document
        .getElementById("googleFrame")
        .src = url;
}


/* ==================================
   検索切り替え
================================== */

function switchSearch(mode){

    const googleArea =
        document.getElementById("googleArea");

    const youtubeArea =
        document.getElementById("youtubeArea");

    const googleTab =
        document.getElementById("googleTab");

    const youtubeTab =
        document.getElementById("youtubeTab");


    if(mode === "google"){

        googleArea.style.display = "flex";

        youtubeArea.classList.remove("show");

        googleTab.classList.add("active");

        youtubeTab.classList.remove("active");

    }else{

        googleArea.style.display = "none";

        youtubeArea.classList.add("show");

        googleTab.classList.remove("active");

        youtubeTab.classList.add("active");

    }
}


/* ==================================
   YouTube API
================================== */


/*
   ここにYouTube Data API v3の
   APIキーを入れる
*/

const YOUTUBE_API_KEY =
    "AIzaSyAqsyHN0bRs_jzBaDQfA84DgTsYGuSOy-A";


async function youtubeSearch(){

    const query =
        document
            .getElementById("youtubeInput")
            .value
            .trim();


    if(query === ""){
        return;
    }


    const results =
        document.getElementById(
            "youtubeResults"
        );


    results.innerHTML =
        '<div class="youtubeMessage">' +
        'YouTubeを検索中...' +
        '</div>';


    /*
       YouTube Data API v3
    */

    const url =
        "https://www.googleapis.com/youtube/v3/search" +
        "?part=snippet" +
        "&type=video" +
        "&maxResults=20" +
        "&q=" +
        encodeURIComponent(query) +
        "&key=" +
        encodeURIComponent(YOUTUBE_API_KEY);


    try{

        const response =
            await fetch(url);


        const data =
            await response.json();


        if(!response.ok){

            throw new Error(
                data.error?.message ||
                "YouTube APIエラー"
            );

        }


        results.innerHTML = "";


        if(!data.items || data.items.length === 0){

            results.innerHTML =
                '<div class="youtubeMessage">' +
                '検索結果がありません。' +
                '</div>';

            return;
        }


        for(const item of data.items){

            const videoId =
                item.id.videoId;


            if(!videoId){
                continue;
            }


            const title =
                item.snippet.title;


            const thumbnail =
                item.snippet.thumbnails?.medium?.url ||
                item.snippet.thumbnails?.default?.url;


            const div =
                document.createElement("div");


            div.className =
                "youtubeResult";


            div.innerHTML =

                '<img ' +
                'class="youtubeThumbnail" ' +
                'src="' +
                thumbnail +
                '" ' +
                'alt="">' +

                '<div class="youtubeResultTitle">' +
                escapeHtml(title) +
                '</div>';


            div.onclick =
                function(){

                    playYoutube(videoId);

                };


            results.appendChild(div);

        }


    }catch(error){

        console.error(error);


        results.innerHTML =
            '<div class="youtubeMessage">' +
            'YouTube検索に失敗しました。<br><br>' +
            escapeHtml(error.message) +
            '</div>';

    }

}


/* ==================================
   YouTube再生
================================== */

function playYoutube(videoId){

    const embedUrl =
        "https://www.youtube.com/embed/" +
        videoId;


    document
        .getElementById("youtubePlayer")
        .src = embedUrl;


    document
        .getElementById("youtubeEmbedUrl")
        .textContent =
        embedUrl;


    document
        .getElementById("youtubeResults")
        .style.display =
        "none";


    document
        .getElementById("youtubePlayerArea")
        .classList.add("show");

}


function closeYoutubePlayer(){

    document
        .getElementById("youtubePlayer")
        .src =
        "about:blank";


    document
        .getElementById("youtubePlayerArea")
        .classList.remove("show");


    document
        .getElementById("youtubeResults")
        .style.display =
        "grid";

}


/* ==================================
   HTMLエスケープ
================================== */

function escapeHtml(text){

    const div =
        document.createElement("div");

    div.textContent = text;

    return div.innerHTML;

}

let zoom = 100;


function applyZoom(){

    const root =
        document.getElementById(
            "zoomRoot"
        );


    root.style.transform =
        "scale(" +
        (zoom / 100) +
        ")";


    root.style.width =
        (100 / (zoom / 100)) + "%";

    root.style.height =
        (100 / (zoom / 100)) + "%";


    document
        .getElementById("zoomValue")
        .textContent =
        zoom + "%";

}


function zoomIn(){

    if(zoom < 200){

        zoom += 10;

        applyZoom();

    }

}


function zoomOut(){

    if(zoom > 50){

        zoom -= 10;

        applyZoom();

    }

}


function zoomReset(){

    zoom = 100;

    applyZoom();

}
