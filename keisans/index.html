<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>掛け算トレーニング</title>

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    font-family:Arial,"Noto Sans JP",sans-serif;
    background:#050510;
    color:white;
}

body{
    overflow:hidden;
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    background:
        radial-gradient(circle at 15% 20%,rgba(0,255,255,.13),transparent 30%),
        radial-gradient(circle at 85% 75%,rgba(255,0,255,.13),transparent 30%);
    pointer-events:none;
}

.page{
    width:100%;
    height:100%;
    display:flex;
    flex-direction:column;
}

header{
    height:68px;
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 28px;
    background:rgba(5,5,16,.9);
    border-bottom:1px solid rgba(0,255,255,.45);
    box-shadow:0 0 20px rgba(0,255,255,.15);
}

.logo{
    font-size:22px;
    font-weight:900;
    letter-spacing:2px;
    color:#00ffff;
    text-shadow:
        0 0 5px #00ffff,
        0 0 15px #00ffff,
        0 0 30px #00ffff;
}

.status{
    font-size:11px;
    color:#ff00ff;
    text-shadow:0 0 10px #ff00ff;
}

main{
    flex:1;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:15px;
    overflow:auto;
}

.card{
    width:min(600px,94vw);
    padding:28px;
    text-align:center;
    background:rgba(8,8,25,.88);
    border:1px solid #00ffff;
    border-radius:20px;
    box-shadow:
        0 0 10px #00ffff,
        0 0 35px rgba(0,255,255,.2),
        inset 0 0 25px rgba(0,255,255,.05);
}

h1{
    margin:0 0 8px;
    font-size:34px;
    color:#00ffff;
    text-shadow:
        0 0 5px #00ffff,
        0 0 20px #00ffff;
}

.subtitle{
    color:#999;
    margin-bottom:18px;
}

.question{
    margin:15px;
    font-size:52px;
    font-weight:900;
    text-shadow:
        0 0 8px white,
        0 0 20px #00ffff;
}

/* 独自入力欄 */
.answerDisplay{
    width:230px;
    height:58px;
    margin:0 auto 15px;
    display:flex;
    align-items:center;
    justify-content:center;
    border:1px solid #ff00ff;
    border-radius:12px;
    background:#080812;
    color:white;
    font-size:30px;
    font-weight:bold;
    letter-spacing:4px;
    box-shadow:
        0 0 8px #ff00ff,
        inset 0 0 15px rgba(255,0,255,.12);
}

.answerDisplay.empty{
    color:#555;
    font-size:18px;
    letter-spacing:0;
}

/* 数字キーパッド */
.keypad{
    width:280px;
    margin:auto;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
}

.key{
    height:50px;
    padding:0;
    font-size:20px;
    border:1px solid #00ffff;
    border-radius:10px;
    background:#07151a;
    color:#00ffff;
    box-shadow:0 0 7px rgba(0,255,255,.4);
}

.key:hover{
    background:#00ffff;
    color:#050510;
    box-shadow:
        0 0 10px #00ffff,
        0 0 25px #00ffff;
}

.key.delete{
    border-color:#ff00ff;
    color:#ff00ff;
}

.key.delete:hover{
    background:#ff00ff;
    color:#050510;
}

.key.clear{
    border-color:#ff3366;
    color:#ff3366;
}

.key.clear:hover{
    background:#ff3366;
    color:white;
}

.key.submit{
    border-color:#00ff99;
    color:#00ff99;
}

.key.submit:hover{
    background:#00ff99;
    color:#050510;
    box-shadow:
        0 0 10px #00ff99,
        0 0 25px #00ff99;
}

.result{
    min-height:28px;
    margin-top:15px;
    font-size:17px;
    font-weight:bold;
}

.correct{
    color:#00ff99;
    text-shadow:0 0 10px #00ff99;
}

.wrong{
    color:#ff3366;
    text-shadow:0 0 10px #ff3366;
}

.score{
    margin-top:12px;
    color:#999;
}

footer{
    height:42px;
    flex-shrink:0;
    display:flex;
    justify-content:center;
    align-items:center;
    background:rgba(5,5,16,.95);
    border-top:1px solid rgba(255,0,255,.3);
}

.aboutButton{
    border:0;
    padding:5px 10px;
    background:transparent;
    color:#777;
    font-size:11px;
    box-shadow:none;
}

.aboutButton:hover{
    background:transparent;
    color:#00ffff;
    box-shadow:none;
    transform:none;
}


/* オーバーレイ */
.overlay{
    position:fixed;
    inset:0;
    display:none;
    flex-direction:column;
    background:#050510;
    z-index:100;
}

.overlay.show{
    display:flex;
}

.overlayHeader{
    height:60px;
    flex-shrink:0;
    display:flex;
    align-items:center;
    gap:15px;
    padding:0 15px;
    background:#070716;
    border-bottom:1px solid #00ffff;
    box-shadow:0 0 20px rgba(0,255,255,.2);
}

.back{
    color:#ff00ff;
    border-color:#ff00ff;
}

.back:hover{
    background:#ff00ff;
    box-shadow:0 0 25px #ff00ff;
}

.overlayTitle{
    color:#00ffff;
    font-weight:bold;
}

.aboutContent{
    flex:1;
    overflow:auto;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:30px;
}

.aboutBox{
    width:min(650px,95vw);
    padding:35px;
    background:#09091b;
    border:1px solid #ff00ff;
    border-radius:18px;
    box-shadow:
        0 0 12px #ff00ff,
        0 0 40px rgba(255,0,255,.15);
}

.aboutBox h2{
    margin-top:0;
    color:#ff00ff;
    text-shadow:0 0 12px #ff00ff;
}

.aboutBox p{
    color:#ccc;
    line-height:1.9;
}


/* Google */
.googleArea{
    position:relative;
    flex:1;
    background:white;
}

.googleFrame{
    width:100%;
    height:100%;
    border:0;
}

.googleNotice{
    position:absolute;
    left:10px;
    bottom:10px;
    padding:7px 10px;
    border-radius:7px;
    background:rgba(0,0,0,.8);
    color:#aaa;
    font-size:10px;
    pointer-events:none;
}


/* 小さい画面 */
@media(max-width:450px){

    header{
        padding:0 15px;
    }

    .logo{
        font-size:17px;
    }

    .status{
        font-size:9px;
    }

    .card{
        padding:20px 12px;
    }

    h1{
        font-size:27px;
    }

    .question{
        font-size:45px;
    }

    .keypad{
        width:260px;
    }
}
</style>
</head>

<body>

<div class="page">

<header>
    <div class="logo">掛け算トレーニング</div>
    <div class="status">● TRAINING MODE</div>
</header>

<main>

<div class="card">

    <h1>掛け算練習</h1>

    <div class="subtitle">
        正解するまで次の問題には進みません
    </div>

    <div class="question" id="question">
        ？ × ？
    </div>

    <!-- 独自入力表示 -->
    <div id="answerDisplay" class="answerDisplay empty">
        答えを入力
    </div>

    <!-- 独自キーパッド -->
    <div class="keypad">

        <button class="key" onclick="pressNumber(1)">1</button>
        <button class="key" onclick="pressNumber(2)">2</button>
        <button class="key" onclick="pressNumber(3)">3</button>

        <button class="key" onclick="pressNumber(4)">4</button>
        <button class="key" onclick="pressNumber(5)">5</button>
        <button class="key" onclick="pressNumber(6)">6</button>

        <button class="key" onclick="pressNumber(7)">7</button>
        <button class="key" onclick="pressNumber(8)">8</button>
        <button class="key" onclick="pressNumber(9)">9</button>

        <button class="key clear" onclick="clearAnswer()">C</button>
        <button class="key" onclick="pressNumber(0)">0</button>
        <button class="key delete" onclick="deleteNumber()">⌫</button>

        <button
            class="key submit"
            style="grid-column:1 / 4"
            onclick="checkAnswer()">
            ✓ 回答する
        </button>

    </div>

    <div id="result" class="result"></div>

    <div class="score">
        正解：
        <span id="score">0</span>
       　
        問題数：
        <span id="total">0</span>
    </div>

</div>

</main>

<footer>

    <button
        class="aboutButton"
        onclick="aboutClick()">
        このサイトについて
    </button>

</footer>

</div>


<!-- このサイトについて -->
<div id="aboutPage" class="overlay">

    <div class="overlayHeader">

        <button class="back" onclick="goBack()">
            ← 戻る
        </button>

        <div class="overlayTitle">
            このサイトについて
        </div>

    </div>

    <div class="aboutContent">

        <div class="aboutBox">

            <h2>このサイトについて</h2>

            <p>
                このサイトでは、1桁の掛け算を中心とした
                練習問題に取り組むことができます。
            </p>

            <p>
                問題は自動的に生成され、
                回答するたびに正解数と問題数が記録されます。
            </p>

            <p>
                短い時間でも繰り返し練習できるよう、
                シンプルで使いやすい構成になっています。
            </p>

            <p>
                掛け算の計算力を身につけるために、
                毎日の練習にご利用ください。
            </p>

        </div>

    </div>

</div>


<!-- Google -->
<div id="googlePage" class="overlay">

    <div class="overlayHeader">

        <button class="back" onclick="goBack()">
            ← 戻る
        </button>

        <div class="overlayTitle">
            検索
        </div>

    </div>

    <div class="googleArea">

        <iframe
            id="googleFrame"
            class="googleFrame"
            src="https://www.google.com/search?igu=1"
            title="Google検索">
        </iframe>

        <div class="googleNotice">
            Google側の設定によって表示できない場合があります。
        </div>

    </div>

</div>


<script>

/* =================================
   掛け算ゲーム
================================= */

let a = 0;
let b = 0;

let answer = "";

let score = 0;
let total = 0;


/* 新しい問題 */
function newQuestion(){

    a = Math.floor(Math.random() * 9) + 1;
    b = Math.floor(Math.random() * 9) + 1;

    answer = "";

    document.getElementById("question")
        .textContent = a + " × " + b;

    updateDisplay();

    document.getElementById("result")
        .textContent = "";
}


/* =================================
   独自入力
================================= */

function pressNumber(number){

    /*
       答えが長くなりすぎないように制限
    */

    if(answer.length >= 3){
        return;
    }

    answer += number;

    updateDisplay();
}


/* 1文字削除 */
function deleteNumber(){

    answer = answer.slice(0,-1);

    updateDisplay();
}


/* 全消去 */
function clearAnswer(){

    answer = "";

    updateDisplay();
}


/* 表示更新 */
function updateDisplay(){

    const display =
        document.getElementById("answerDisplay");

    if(answer === ""){

        display.textContent = "答えを入力";

        display.classList.add("empty");

    }else{

        display.textContent = answer;

        display.classList.remove("empty");

    }

}


/* =================================
   回答
================================= */

function checkAnswer(){

    if(answer === ""){
        return;
    }

    const value = Number(answer);

    /*
       正解した場合のみ
       次の問題へ進む
    */

    if(value === a * b){

        score++;
        total++;

        document.getElementById("result").innerHTML =
            '<span class="correct">✓ 正解！ 次の問題へ！</span>';

        document.getElementById("score")
            .textContent = score;

        document.getElementById("total")
            .textContent = total;

        /*
           少しだけ正解表示を見せてから
           次の問題へ
        */

        setTimeout(function(){

            newQuestion();

        },500);

    }else{

        /*
           不正解の場合は問題を変更しない
        */

        total++;

        document.getElementById("result").innerHTML =
            '<span class="wrong">✕ 不正解！ もう一度！</span>';

        document.getElementById("total")
            .textContent = total;

        /*
           間違えた答えを消す
        */

        setTimeout(function(){

            clearAnswer();

        },400);
    }

}


/* =================================
   このサイトについて
================================= */

let aboutCount = 0;

function aboutClick(){

    aboutCount++;

    /*
       1回目 → 説明
       2回目 → 説明
       3回目 → Google
    */

    if(aboutCount <= 2){

        showPage("aboutPage");

    }else{

        showPage("googlePage");

    }

}


/* =================================
   画面切り替え
================================= */

function showPage(id){

    document
        .getElementById("aboutPage")
        .classList.remove("show");

    document
        .getElementById("googlePage")
        .classList.remove("show");

    document
        .getElementById(id)
        .classList.add("show");

    history.pushState(
        {page:id},
        "",
        "#" + id
    );

}


/* =================================
   戻る
================================= */

function goBack(){

    history.back();

}


window.addEventListener("popstate",function(){

    document
        .getElementById("aboutPage")
        .classList.remove("show");

    document
        .getElementById("googlePage")
        .classList.remove("show");

});


/* 最初の問題 */
newQuestion();

</script>

</body>
</html>
