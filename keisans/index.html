<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>掛け算トレーニング</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    font-family: Arial, "Noto Sans JP", sans-serif;
    background: #050510;
    color: white;
}

body {
    overflow-x: hidden;
}

#zoomRoot {
    min-height: 100vh;
    transform-origin: top left;
    transition: transform 0.2s ease;
}

.container {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
}

/* =========================================================
   ヘッダー
========================================================= */

header {
    height: 70px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 25px;

    background:
        linear-gradient(
            90deg,
            rgba(0,255,255,0.12),
            rgba(255,0,255,0.12)
        );

    border-bottom: 1px solid #00ffff;

    box-shadow:
        0 0 15px rgba(0,255,255,0.35);
}

.logo {
    font-size: 24px;
    font-weight: bold;

    color: #00ffff;

    text-shadow:
        0 0 5px #00ffff,
        0 0 15px #00ffff;
}

.status {
    font-size: 13px;
    color: #aaa;
}

.zoom-controls {
    display: flex;
    gap: 5px;
}

.zoom-controls button {
    width: 35px;
    height: 35px;

    border: 1px solid #00ffff;
    background: #080820;
    color: #00ffff;

    cursor: pointer;
    border-radius: 5px;
}

.zoom-controls button:hover {
    background: #00ffff;
    color: #000;
}

/* =========================================================
   メイン
========================================================= */

main {
    flex: 1;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 30px;
}

.training-box {
    width: min(600px, 95vw);

    padding: 35px;

    border: 1px solid #00ffff;
    border-radius: 15px;

    background:
        linear-gradient(
            145deg,
            rgba(0,255,255,0.07),
            rgba(255,0,255,0.07)
        );

    box-shadow:
        0 0 20px rgba(0,255,255,0.25),
        inset 0 0 20px rgba(255,0,255,0.08);

    text-align: center;
}

.training-box h1 {
    margin-top: 0;

    color: #00ffff;

    text-shadow:
        0 0 8px #00ffff;
}

.question {
    margin: 30px 0;

    font-size: 45px;
    font-weight: bold;

    color: white;

    text-shadow:
        0 0 10px #ffffff;
}

.answer-input {
    width: 100%;

    padding: 15px;

    font-size: 25px;
    text-align: center;

    border-radius: 8px;
    border: 1px solid #00ffff;

    background: #050510;
    color: white;

    outline: none;
}

.answer-input:focus {
    box-shadow:
        0 0 15px rgba(0,255,255,0.5);
}

.action-button {
    margin-top: 20px;

    padding: 13px 30px;

    border: 1px solid #ff00ff;
    border-radius: 8px;

    background: #100518;
    color: #ff00ff;

    font-size: 18px;
    font-weight: bold;

    cursor: pointer;
}

.action-button:hover {
    background: #ff00ff;
    color: #000;

    box-shadow:
        0 0 20px #ff00ff;
}

.result {
    margin-top: 20px;
    min-height: 30px;

    font-size: 20px;
}

/* =========================================================
   フッター
========================================================= */

footer {
    padding: 15px;

    text-align: center;

    border-top: 1px solid #ff00ff;

    background: #050510;
}

.about-button {
    padding: 10px 20px;

    border: 1px solid #ff00ff;
    border-radius: 7px;

    background: transparent;
    color: #ff00ff;

    cursor: pointer;
}

.about-button:hover {
    background: #ff00ff;
    color: black;

    box-shadow:
        0 0 15px #ff00ff;
}

/* =========================================================
   オーバーレイ
========================================================= */

.overlay {
    position: fixed;

    inset: 0;

    z-index: 1000;

    display: none;

    background:
        rgba(0,0,10,0.97);

    overflow-y: auto;
}

.overlay-content {
    width: min(1000px, 95vw);

    margin: 30px auto;

    padding: 30px;

    border: 1px solid #00ffff;
    border-radius: 15px;

    background:
        linear-gradient(
            145deg,
            rgba(0,255,255,0.05),
            rgba(255,0,255,0.05)
        );

    box-shadow:
        0 0 30px rgba(0,255,255,0.2);
}

.overlay-title {
    color: #00ffff;

    text-align: center;

    text-shadow:
        0 0 10px #00ffff;
}

.close-button {
    float: right;

    width: 35px;
    height: 35px;

    border: 1px solid #ff00ff;
    border-radius: 5px;

    background: transparent;
    color: #ff00ff;

    cursor: pointer;
}

.close-button:hover {
    background: #ff00ff;
    color: #000;
}

/* =========================================================
   検索タブ
========================================================= */

.search-tabs {
    display: flex;
    gap: 10px;

    margin-bottom: 20px;
}

.search-tab {
    flex: 1;

    padding: 13px;

    border: 1px solid #00ffff;
    border-radius: 7px;

    background: #070715;
    color: #00ffff;

    cursor: pointer;

    font-weight: bold;
}

.search-tab.active {
    background: #00ffff;
    color: #000;

    box-shadow:
        0 0 15px #00ffff;
}

.search-panel {
    display: none;
}

.search-panel.active {
    display: block;
}

/* =========================================================
   検索欄
========================================================= */

.search-input-area {
    display: flex;
    gap: 10px;

    margin-bottom: 20px;
}

.search-input {
    flex: 1;

    padding: 13px;

    border: 1px solid #00ffff;
    border-radius: 7px;

    background: #050510;
    color: white;

    outline: none;

    font-size: 16px;
}

.search-input:focus {
    box-shadow:
        0 0 15px rgba(0,255,255,0.4);
}

.search-button {
    padding: 13px 20px;

    border: 1px solid #00ffff;
    border-radius: 7px;

    background: #071515;
    color: #00ffff;

    cursor: pointer;

    font-weight: bold;
}

.search-button:hover {
    background: #00ffff;
    color: #000;
}

/* =========================================================
   Google
========================================================= */

.google-frame {
    width: 100%;
    height: 600px;

    border: 1px solid #333;
    border-radius: 10px;

    background: white;
}

/* =========================================================
   YouTube検索結果
========================================================= */

.youtube-results {
    display: grid;

    grid-template-columns:
        repeat(
            auto-fill,
            minmax(280px, 1fr)
        );

    gap: 15px;
}

.youtube-result {
    overflow: hidden;

    border: 1px solid #333;
    border-radius: 10px;

    background: #090914;

    cursor: pointer;

    transition:
        transform 0.15s,
        border-color 0.15s,
        box-shadow 0.15s;
}

.youtube-result:hover {
    transform: translateY(-3px);

    border-color: #ff00ff;

    box-shadow:
        0 0 15px rgba(255,0,255,0.3);
}

.youtube-thumbnail {
    width: 100%;

    display: block;

    aspect-ratio: 16 / 9;

    object-fit: cover;
}

.youtube-info {
    padding: 12px;
}

.youtube-title {
    font-size: 16px;
    font-weight: bold;

    line-height: 1.4;

    color: white;

    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;

    overflow: hidden;
}

.youtube-channel {
    margin-top: 8px;

    font-size: 13px;

    color: #00ffff;
}

.youtube-date {
    margin-top: 5px;

    font-size: 12px;

    color: #888;
}

.youtube-message {
    padding: 30px;

    text-align: center;

    color: #aaa;
}

/* =========================================================
   Shortsプレイヤー
========================================================= */

#youtubePlayerArea {
    display: none;

    margin-top: 25px;
}

.player-title {
    margin-bottom: 10px;

    color: #ff00ff;

    font-weight: bold;

    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.shorts-container {
    width: 100%;

    height: 80vh;

    overflow-y: auto;

    scroll-snap-type: y mandatory;

    overscroll-behavior-y: contain;

    scrollbar-width: none;

    border-radius: 12px;

    background: #000;
}

.shorts-container::-webkit-scrollbar {
    display: none;
}

.short-item {
    width: 100%;

    height: 80vh;

    scroll-snap-align: start;

    scroll-snap-stop: always;

    display: flex;

    align-items: center;
    justify-content: center;

    background: #000;

    position: relative;
}

.short-item iframe {
    width: min(450px, 100%);

    height: 100%;

    border: 0;
}

.player-close {
    margin-top: 10px;

    padding: 8px 15px;

    border: 1px solid #ff00ff;
    border-radius: 6px;

    background: transparent;
    color: #ff00ff;

    cursor: pointer;
}

.player-close:hover {
    background: #ff00ff;
    color: #000;
}

/* =========================================================
   スマホ
========================================================= */

@media (max-width: 600px) {

    header {
        padding: 0 12px;
    }

    .logo {
        font-size: 18px;
    }

    .status {
        display: none;
    }

    main {
        padding: 15px;
    }

    .training-box {
        padding: 20px;
    }

    .question {
        font-size: 35px;
    }

    .overlay-content {
        margin: 10px auto;
        padding: 15px;
    }

    .search-input-area {
        flex-direction: column;
    }

    .youtube-results {
        grid-template-columns: 1fr;
    }

    .google-frame {
        height: 500px;
    }

    .shorts-container {
        height: 75vh;
    }

    .short-item {
        height: 75vh;
    }

    .short-item iframe {
        width: 100%;
    }
}
</style>
</head>

<body>

<div id="zoomRoot">

<div class="container">

<!-- =======================================================
     HEADER
======================================================= -->

<header>

    <div class="logo">
        掛け算トレーニング
    </div>

    <div class="status">
        × multiplication training
    </div>

    <div class="zoom-controls">

        <button onclick="changeZoom(-0.1)">
            −
        </button>

        <button onclick="resetZoom()">
            100%
        </button>

        <button onclick="changeZoom(0.1)">
            ＋
        </button>

    </div>

</header>


<!-- =======================================================
     MAIN
======================================================= -->

<main>

<div class="training-box">

    <h1>
        掛け算トレーニング
    </h1>

    <div
        class="question"
        id="question"
    >
        1 × 1 = ?
    </div>

    <input
        id="answer"
        class="answer-input"
        type="number"
        placeholder="答えを入力"
        autocomplete="off"
    >

    <button
        class="action-button"
        onclick="checkAnswer()"
    >
        回答する
    </button>

    <div
        class="result"
        id="result"
    ></div>

</div>

</main>


<!-- =======================================================
     FOOTER
======================================================= -->

<footer>

    <button
        class="about-button"
        onclick="aboutButtonClicked()"
    >
        このサイトについて
    </button>

</footer>

</div>
</div>


<!-- =======================================================
     ABOUT
======================================================= -->

<div
    id="aboutOverlay"
    class="overlay"
>

    <div class="overlay-content">

        <button
            class="close-button"
            onclick="closeOverlay()"
        >
            ×
        </button>

        <h1 class="overlay-title">
            このサイトについて
        </h1>

        <p>
            このサイトは掛け算の練習をするための
            トレーニングサイトです。
        </p>

        <p>
            フッターのボタンを3回押すと、
            検索ページを開くことができます。
        </p>

    </div>

</div>


<!-- =======================================================
     SEARCH
======================================================= -->

<div
    id="searchOverlay"
    class="overlay"
>

    <div class="overlay-content">

        <button
            class="close-button"
            onclick="closeOverlay()"
        >
            ×
        </button>

        <h1 class="overlay-title">
            検索
        </h1>


        <!-- タブ -->

        <div class="search-tabs">

            <button
                id="googleTab"
                class="search-tab active"
                onclick="switchSearch('google')"
            >
                Google
            </button>

            <button
                id="youtubeTab"
                class="search-tab"
                onclick="switchSearch('youtube')"
            >
                YouTube
            </button>

        </div>


        <!-- =================================================
             GOOGLE
        ================================================== -->

        <div
            id="googlePanel"
            class="search-panel active"
        >

            <div class="search-input-area">

                <input
                    id="googleSearchInput"
                    class="search-input"
                    type="text"
                    placeholder="Googleで検索..."
                    onkeydown="
                        if(event.key === 'Enter')
                            googleSearch()
                    "
                >

                <button
                    class="search-button"
                    onclick="googleSearch()"
                >
                    検索
                </button>

            </div>

            <iframe
                id="googleFrame"
                class="google-frame"
                src="https://www.google.com/search?igu=1"
                title="Google検索"
            ></iframe>

        </div>


        <!-- =================================================
             YOUTUBE
        ================================================== -->

        <div
            id="youtubePanel"
            class="search-panel"
        >

            <div class="search-input-area">

                <input
                    id="youtubeSearchInput"
                    class="search-input"
                    type="text"
                    placeholder="YouTubeで検索..."
                    onkeydown="
                        if(event.key === 'Enter')
                            youtubeSearch()
                    "
                >

                <button
                    class="search-button"
                    onclick="youtubeSearch()"
                >
                    検索
                </button>

            </div>


            <!-- Shortsプレイヤー -->

            <div
                id="youtubePlayerArea"
            >

                <div
                    class="player-title"
                    id="playerTitle"
                >
                    ▶ 再生中
                </div>


                <div
                    id="shortsContainer"
                    class="shorts-container"
                ></div>


                <button
                    class="player-close"
                    onclick="closeYoutubePlayer()"
                >
                    プレイヤーを閉じる
                </button>

            </div>


            <!-- 検索結果 -->

            <div
                id="youtubeResults"
                class="youtube-results"
            >

                <div class="youtube-message">
                    YouTubeで検索してください。
                </div>

            </div>

        </div>

    </div>

</div>


<script>

/* =========================================================
   YouTube API KEY
========================================================= */

/*
    ここに自分のYouTube Data API v3の
    APIキーを入れてください。
*/

const YOUTUBE_API_KEY =
    "YOUR_YOUTUBE_API_KEY";


/* =========================================================
   掛け算
========================================================= */

let numberA = 1;
let numberB = 1;


function newQuestion() {

    numberA =
        Math.floor(
            Math.random() * 9
        ) + 1;

    numberB =
        Math.floor(
            Math.random() * 9
        ) + 1;


    document.getElementById(
        "question"
    ).textContent =
        `${numberA} × ${numberB} = ?`;


    document.getElementById(
        "answer"
    ).value = "";


    document.getElementById(
        "result"
    ).textContent = "";
}


function checkAnswer() {

    const answer =
        Number(
            document.getElementById(
                "answer"
            ).value
        );


    const correct =
        numberA * numberB;


    const result =
        document.getElementById(
            "result"
        );


    if (answer === correct) {

        result.textContent =
            "⭕ 正解！";

        result.style.color =
            "#00ffff";


        setTimeout(
            newQuestion,
            600
        );

    } else {

        result.textContent =
            "❌ 不正解！";

        result.style.color =
            "#ff00ff";
    }
}


document
    .getElementById("answer")
    .addEventListener(
        "keydown",
        function(event) {

            if (event.key === "Enter") {
                checkAnswer();
            }

        }
    );


newQuestion();


/* =========================================================
   ズーム
========================================================= */

let zoom = 1;


function changeZoom(amount) {

    zoom += amount;


    if (zoom < 0.5)
        zoom = 0.5;


    if (zoom > 2)
        zoom = 2;


    document.getElementById(
        "zoomRoot"
    ).style.transform =
        `scale(${zoom})`;
}


function resetZoom() {

    zoom = 1;


    document.getElementById(
        "zoomRoot"
    ).style.transform =
        "scale(1)";
}


/* =========================================================
   About
========================================================= */

let aboutClickCount = 0;


function aboutButtonClicked() {

    aboutClickCount++;


    if (aboutClickCount >= 3) {

        aboutClickCount = 0;

        openSearch();

    } else {

        document.getElementById(
            "aboutOverlay"
        ).style.display =
            "block";
    }
}


/* =========================================================
   Overlay
========================================================= */

function closeOverlay() {

    document.getElementById(
        "aboutOverlay"
    ).style.display =
        "none";


    document.getElementById(
        "searchOverlay"
    ).style.display =
        "none";
}


function openSearch() {

    document.getElementById(
        "aboutOverlay"
    ).style.display =
        "none";


    document.getElementById(
        "searchOverlay"
    ).style.display =
        "block";
}


/* =========================================================
   検索タブ
========================================================= */

function switchSearch(type) {

    const googlePanel =
        document.getElementById(
            "googlePanel"
        );


    const youtubePanel =
        document.getElementById(
            "youtubePanel"
        );


    const googleTab =
        document.getElementById(
            "googleTab"
        );


    const youtubeTab =
        document.getElementById(
            "youtubeTab"
        );


    if (type === "google") {

        googlePanel.classList.add(
            "active"
        );

        youtubePanel.classList.remove(
            "active"
        );

        googleTab.classList.add(
            "active"
        );

        youtubeTab.classList.remove(
            "active"
        );

    } else {

        googlePanel.classList.remove(
            "active"
        );

        youtubePanel.classList.add(
            "active"
        );

        googleTab.classList.remove(
            "active"
        );

        youtubeTab.classList.add(
            "active"
        );
    }
}


/* =========================================================
   Google検索
========================================================= */

function googleSearch() {

    const query =
        document.getElementById(
            "googleSearchInput"
        ).value.trim();


    if (!query)
        return;


    const url =
        "https://www.google.com/search?igu=1&q=" +
        encodeURIComponent(query);


    document.getElementById(
        "googleFrame"
    ).src = url;
}


/* =========================================================
   YouTube動画データ
========================================================= */

let youtubeVideos = [];

let currentYoutubeIndex = 0;


/* =========================================================
   YouTube検索
========================================================= */

async function youtubeSearch() {

    const query =
        document.getElementById(
            "youtubeSearchInput"
        ).value.trim();


    if (!query)
        return;


    const results =
        document.getElementById(
            "youtubeResults"
        );


    results.innerHTML = `
        <div class="youtube-message">
            YouTubeを検索中...
        </div>
    `;


    /* APIキー確認 */

    if (
        !YOUTUBE_API_KEY ||
        YOUTUBE_API_KEY ===
        "YOUR_YOUTUBE_API_KEY"
    ) {

        results.innerHTML = `
            <div class="youtube-message">
                YouTube APIキーが設定されていません。
                <br><br>
                HTML内の
                <b>YOUTUBE_API_KEY</b>
                にAPIキーを設定してください。
            </div>
        `;

        return;
    }


    try {

        const url =
            "https://www.googleapis.com/youtube/v3/search" +
            "?part=snippet" +
            "&type=video" +
            "&maxResults=20" +
            "&q=" +
            encodeURIComponent(query) +
            "&key=" +
            encodeURIComponent(
                YOUTUBE_API_KEY
            );


        const response =
            await fetch(url);


        const data =
            await response.json();


        /* APIエラー */

        if (data.error) {

            console.error(
                data.error
            );


            results.innerHTML = `
                <div class="youtube-message">
                    YouTube APIエラー
                    <br><br>
                    ${escapeHtml(
                        data.error.message ||
                        "不明なエラー"
                    )}
                </div>
            `;

            return;
        }


        /* 動画なし */

        if (
            !data.items ||
            data.items.length === 0
        ) {

            results.innerHTML = `
                <div class="youtube-message">
                    動画が見つかりませんでした。
                </div>
            `;

            return;
        }


        /*
           動画データ保存
        */

        youtubeVideos =
            data.items
                .filter(
                    item =>
                        item.id &&
                        item.id.videoId
                )
                .map(
                    item => ({
                        videoId:
                            item.id.videoId,

                        title:
                            item.snippet.title,

                        channelTitle:
                            item.snippet.channelTitle,

                        thumbnail:
                            item.snippet.thumbnails
                                .high?.url ||
                            item.snippet.thumbnails
                                .medium?.url ||
                            item.snippet.thumbnails
                                .default?.url
                    })
                );


        currentYoutubeIndex = 0;


        /* 検索結果表示 */

        results.innerHTML = "";


        youtubeVideos.forEach(
            (video, index) => {

                const card =
                    document.createElement(
                        "div"
                    );


                card.className =
                    "youtube-result";


                card.innerHTML = `

                    <img
                        src="${escapeHtml(
                            video.thumbnail
                        )}"
                        class="youtube-thumbnail"
                        alt=""
                    >

                    <div class="youtube-info">

                        <div
                            class="youtube-title"
                            title="${escapeHtml(
                                video.title
                            )}"
                        >
                            ${escapeHtml(
                                video.title
                            )}
                        </div>

                        <div
                            class="youtube-channel"
                        >
                            ${escapeHtml(
                                video.channelTitle
                            )}
                        </div>

                    </div>
                `;


                card.addEventListener(
                    "click",
                    () => {

                        playYoutube(
                            video.videoId,
                            video.title,
                            index
                        );

                    }
                );


                results.appendChild(
                    card
                );

            }
        );


    } catch (error) {

        console.error(
            error
        );


        results.innerHTML = `
            <div class="youtube-message">
                YouTubeに接続できませんでした。
                <br><br>
                ネットワーク接続を確認してください。
            </div>
        `;
    }
}


/* =========================================================
   Shortsプレイヤー
========================================================= */

function playYoutube(
    videoId,
    title,
    index
) {

    currentYoutubeIndex =

    const playerArea =
        document.getElementById(
            "youtubePlayerArea"
        );


    const container =
        document.getElementById(
            "shortsContainer"
        );


    const playerTitle =

    playerTitle.textContent =

    */

    youtubeVideos.forEach(
        (video, i) => {

            const item =
                document.createElement(
                    "div"
                );


            item.className =
                "short-item";


            const iframe =
                document.createElement(
                    "iframe"
                );


            /*
               選択した動画だけ
               最初から自動再生
            */

            iframe.src =
                `https://www.youtube.com/embed/${video.videoId}` +
                `?autoplay=${i === index ? 1 : 0}` +
                `&playsinline=1`;


            iframe.allow =
                "autoplay; encrypted-media; picture-in-picture; fullscreen";


            iframe.allowFullscreen =
                true;


            item.appendChild(
                iframe
            );


            container.appendChild(
                item
            );

        }
    );


    /*
       選択した動画まで移動
    */

    setTimeout(
        () => {

            const items =
                container.querySelectorAll(
                    ".short-item"
                );


            if (items[index]) {

                items[index].scrollIntoView({
                    behavior: "instant",
                    block: "start"
                });

            }

        },
        50
    );


    /*
       スクロール位置を監視
    */

    setupShortsScroll();
}


/* =========================================================
   Shortsスクロール監視
========================================================= */

let shortsScrollReady = false;


function setupShortsScroll() {

    const container =
        document.getElementById(
            "shortsContainer"
        );


    if (shortsScrollReady)
        return;


    shortsScrollReady = true;


    container.addEventListener(
        "scroll",
        function() {

            const height =
                container.clientHeight;


            if (height <= 0)
                return;


            const index =
                Math.round(
                    container.scrollTop /
                    height
                );


            if (
                index < 0 ||
                index >= youtubeVideos.length
            ) {
                return;
            }


            if (
                index !==
                currentYoutubeIndex
            ) {

                currentYoutubeIndex =
                    index;


                updateCurrentShort(
                    index
                );
            }

        }
    );
}


/* =========================================================
   現在のShortsを更新
========================================================= */

function updateCurrentShort(index) {

    const video =
        youtubeVideos[index];


    if (!video)
        return;


    document.getElementById(
        "playerTitle"
    ).textContent =
        "▶ " + video.title;


    const container =
        document.getElementById(
            "shortsContainer"
        );


    const items =
        container.querySelectorAll(
            ".short-item"
        );


    /*
       現在の動画だけ再生
    */

    items.forEach(
        (item, i) => {

            const iframe =
                item.querySelector(
                    "iframe"
                );


            if (!iframe)
                return;


            if (i === index) {

                iframe.src =
                    `https://www.youtube.com/embed/${youtubeVideos[i].videoId}` +
                    `?autoplay=1&playsinline=1`;

            } else {

                /*
                   他の動画は停止
                */

                iframe.src =
                    `https://www.youtube.com/embed/${youtubeVideos[i].videoId}` +
                    `?autoplay=0&playsinline=1`;
            }

        }
    );
}


/* =========================================================
   YouTubeプレイヤーを閉じる
========================================================= */

function closeYoutubePlayer() {

    const playerArea =
        document.getElementById(
            "youtubePlayerArea"
        );


    const container =
        document.getElementById(
            "shortsContainer"
        );


    container.innerHTML =
        "";


    playerArea.style.display =
        "none";


    currentYoutubeIndex =
        0;

    shortsScrollReady =
        false;
}


/* =========================================================
   HTMLエスケープ
========================================================= */

function escapeHtml(text) {

    const div =
        document.createElement(
            "div"
        );


    div.textContent =
        text ?? "";


    return div.innerHTML;
}
